<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace | Buy & Sell</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background-color: #f5f5f5; }
        header { background-color: #1565c0; color: white; padding: 1rem; text-align: center; }
        nav { background-color: #2e7d32; color: white; padding: 0.5rem; text-align: center; }
        .container { max-width: 1000px; margin: 20px auto; padding: 20px; background: white; border-radius: 8px; }
        .upload-section { border: 2px dashed #1565c0; padding: 20px; margin-bottom: 20px; text-align: center; }
        .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .item-card { border: 1px solid #ddd; padding: 10px; border-radius: 8px; text-align: center; }
        button { background-color: #2e7d32; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>
    <header><h1>Marketplace Hub</h1></header>
    <nav>Buy & Sell Items Easily</nav>
    <div class="container">
        <section class="upload-section">
            <h2>Post an Item for Sale</h2>
            <input type="file"><br><br>
            <button>List Item</button>
        </section>
        <h2>Latest Items (Dummy Data)</h2>
        <div class="item-grid">
            <div class="item-card"><h3>Smartphone</h3><p>$200</p><button>Buy Now</button></div>
            <div class="item-card"><h3>Vintage Camera</h3><p>$150</p><button>Buy Now</button></div>
        </div>
    </div>
</body>
</html>
